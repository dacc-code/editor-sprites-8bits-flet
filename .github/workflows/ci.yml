name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile app.py

      - name: Logic check (conversión 64 bits)
        run: |
          python - <<'EOF'
          import app as m
          assert m.bin_to_hex("1" * 64) == "FFFFFFFFFFFFFFFF", "bin->hex"
          assert m.hex_to_bin("00FF00FF00FF00FF").count("1") == 32, "hex->bin"
          try:
              m.hex_to_bin("ZZZZ")
              raise SystemExit("debió rechazar ZZZZ")
          except ValueError:
              pass
          print("logic OK: bin<->hex + validación")
          EOF
